<aside class="pico-sidebar">

    <!-- Product identity + current user -->
    <div class="pico-sidebar-head">
        <h1 class="pico-brand">{{'APP.NAME' | translate}}</h1>
        <div class="pico-user" ng-hide="isAnonymous()">
            <div class="pico-user-avatar" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-3.34 0-10 1.67-10 5v3h20v-3c0-3.33-6.66-5-10-5Z"/></svg>
            </div>
            <div class="pico-user-text">
                <p class="pico-user-name">{{fullName || username}}</p>
                <p class="pico-user-role">{{role || username}}</p>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="pico-nav">
        <a ng-repeat="page in pages" href="#{{page.url}}"
           class="pico-nav-link" ng-class="{active: isActive(page)}">
            <span class="pico-nav-icon" ng-switch="getIcon(page)" aria-hidden="true">
                <svg ng-switch-when="connections" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 6h16v2H4V6Zm0 5h16v2H4v-2Zm0 5h16v2H4v-2Z"/></svg>
                <svg ng-switch-when="history" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M13 3a9 9 0 1 0 8.94 10H19.9A7 7 0 1 1 13 5a6.9 6.9 0 0 1 4.9 2H15v2h6V3h-2v2.3A9 9 0 0 0 13 3Zm-1 5v5l4 2 .7-1.3L13.5 12V8Z"/></svg>
                <svg ng-switch-when="settings" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="m19.4 13 .1-1-.1-1 2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L15 3H9l-.3 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L2.6 11l-.1 1 .1 1-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1L9 21h6l.3-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6ZM12 15a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/></svg>
            </span>
            <span class="pico-nav-text">{{page.name | translate}}</span>
        </a>

        <a href="" ng-click="logout()" class="pico-nav-link pico-nav-logout" ng-hide="isAnonymous()">
            <span class="pico-nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M10 17v-2H5V9h5V7l5 5-5 5Zm2-14a9 9 0 0 1 0 18 9 9 0 0 1-7.9-4.7l1.8-1A7 7 0 1 0 12 5a6.9 6.9 0 0 0-6.1 3.6l-1.8-1A9 9 0 0 1 12 3Z"/></svg>
            </span>
            <span class="pico-nav-text">{{'USER_MENU.ACTION_LOGOUT' | translate}}</span>
        </a>
    </nav>

</aside>
